name: Release

# Triggered by a version tag pushed to the repo (see build/release.mjs, which
# creates the tag after bumping versions and passing the validate gate):
#
#   npm run release -- patch && git push origin main vX.Y.Z

on:
  push:
    tags: ["v*"]
  # Manual runs build + smoke-test + upload the binaries as workflow
  # artifacts, but only a real v* tag creates a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # false so a transient flake on one OS cannot cancel the other two
      # builds mid-run; the `release` job still needs ALL legs green, so no
      # release ever ships with a binary missing. (`continue-on-error` on a
      # leg would trade that guarantee away — don't.)
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: dist/point-bang
            suffix: linux-x64
          - os: windows-latest
            binary: dist/point-bang.exe
            suffix: win-x64.exe
          # arm64 (Apple Silicon) — every Mac since 2020.
          - os: macos-latest
            binary: dist/point-bang
            suffix: macos-arm64
          # x64 (Intel Macs; user decision 2026-08-14 — a 2018 i9 to
          # support). Built on macOS 15 because Intel Macs of that era top
          # out there, and it's GitHub's LAST x64 image — retired August
          # 2027, at which point this artifact can no longer be built.
          - os: macos-15-intel
            binary: dist/point-bang
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:sea
      - name: Smoke-test the executable
        run: node build/smoke.mjs
      - name: Name the binary after the tag
        run: node -e "require('fs').renameSync(process.env.SRC, 'dist/point-bang-' + process.env.TAG + '-' + process.env.SUFFIX)"
        env:
          SRC: ${{ matrix.binary }}
          TAG: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/point-bang-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/point-bang-*
          generate_release_notes: true
