name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    # Windows is the primary play target and Linux is the primary dev box —
    # both must stay green (CRLF, path separators, native addon loading).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar blames new code against history; a shallow clone breaks that
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Formatting/dead-code gates are OS-independent; running them once keeps
      # the Windows job focused on what actually differs there.
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm run knip
        if: runner.os == 'Linux'
      # the Pages phone-page publish must not break silently on push to main
      - run: npm run docs:build
        if: runner.os == 'Linux'
      - run: npm run typecheck
      - run: npm test
      # Quality trackers run once (Linux) and are skipped gracefully until
      # the CODECOV_TOKEN / SONAR_TOKEN repo secrets exist.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: SonarQube scan
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sea:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:sea
      - name: Smoke-test the executable
        run: node build/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: point-bang-${{ matrix.os }}
          path: dist/point-bang*
          if-no-files-found: error
