name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    # Windows is the primary play target and Linux is the primary dev box —
    # both must stay green (CRLF, path separators, native addon loading).
    # macOS (arm64 here; x64 in the sea job) is the community-verified
    # tier: same gates, beta-tested end-to-end (the owner has no Mac
    # hardware).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar blames new code against history; a shallow clone breaks that
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Formatting/dead-code gates are OS-independent; running them once keeps
      # the Windows job focused on what actually differs there.
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm run knip
        if: runner.os == 'Linux'
      # the Pages phone-page publish must not break silently on push to main
      - run: npm run docs:build
        if: runner.os == 'Linux'
      - run: npm run typecheck
      - run: npm test
      # the editor workspace gates (tests + vite build) on BOTH OSes —
      # Windows is the primary platform
      - run: npm run -w editor validate
      # Real-CoreGraphics integration probe (macOS only): proves the raw
      # koffi struct API, the CGRect-by-value ABI on arm64, and that the
      # runner's GUI session has a display — facts no injected fake can
      # prove, and the owner has no Mac to prove them on. If GitHub ever
      # moves to display-less runners this exits 1 with a clean reason line;
      # the fix then is demoting it to expected-output-only.
      - run: node cli.ts monitors
        if: runner.os == 'macOS'
      # Quality trackers run once (Linux) and are skipped gracefully until
      # the CODECOV_TOKEN / SONAR_TOKEN repo secrets exist.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info,editor/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: SonarQube scan
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sea:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel gates the x64 macOS artifact (user's 2018 i9 Mac).
        # Intel is sea-only: the TS code paths are arch-independent and run
        # in validate on macos-latest (arm64); what differs per arch is the
        # native prebuilds + SEA pipeline, which is exactly this job. NOTE:
        # GitHub retires its last x64 macOS image (macos-15-intel) in
        # August 2027 — the Intel artifact dies with it.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:sea
      - name: Smoke-test the executable
        run: node build/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: point-bang-${{ matrix.os }}
          path: dist/point-bang*
          if-no-files-found: error
