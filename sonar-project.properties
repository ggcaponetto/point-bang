# SonarQube Cloud configuration — the scan runs in CI (ci.yml) once the
# SONAR_TOKEN repo secret exists; the badge lives in README.md and on the
# hosted start page.
sonar.projectKey=ggcaponetto_point-bang
sonar.organization=ggcaponetto
sonar.projectName=point-bang

sonar.sources=lib,public,editor/src,site/src,server.ts,cli.ts
sonar.tests=test,editor/test
sonar.exclusions=docs/**,dist/**,coverage/**,editor/coverage/**,public/editor.html
sonar.javascript.lcov.reportPaths=coverage/lcov.info,editor/coverage/lcov.info

# Translation dictionaries are inherently "duplicated" (same keys per
# language, different values) — exclude them from copy-paste detection only;
# all other rules still apply to these files.
sonar.cpd.exclusions=editor/src/locales.ts,site/src/i18n.ts

sonar.sourceEncoding=UTF-8
