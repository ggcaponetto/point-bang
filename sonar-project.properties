# SonarQube Cloud configuration — the scan runs in CI (ci.yml) once the
# SONAR_TOKEN repo secret exists; the badge lives in README.md and on the
# hosted start page.
sonar.projectKey=ggcaponetto_point-bang
sonar.organization=ggcaponetto
sonar.projectName=point-bang

sonar.sources=lib,public,site/src,server.ts,cli.ts
sonar.tests=test
sonar.exclusions=docs/**,dist/**,coverage/**,site/node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
